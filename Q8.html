
<!DOCTYPE html>
<html>
<head>
    <title>CSS Different Colours</title>

    <style>
        /* Page background */
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Heading style */
        h1 {
            color: purple;
            font-family: Georgia, serif;
            font-size: 40px;
            font-style: italic;
        }

        /* Paragraph style */
        p {
            color: green;
            font-family: Verdana, sans-serif;
            font-size: 20px;
            font-weight: bold;
        }

        /* Single element background */
        .box {
            background-color: navy;
            color: orange;
            font-family: cursive;
            font-size: 24px;
            padding: 40px;
            margin: 30px;
            border: 3px solid red;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Web Page</h1>

    <p>This paragraph uses green colour and a different font.</p>

    <div class="box">
        This box has a navy background and orange text.
    </div>

</body>
</html>
