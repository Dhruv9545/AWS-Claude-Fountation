<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: green;
        }

        p {
            color: blue;
        }

        /* External CSS ka code bhi yahan mix kiya hai */
        body {
            background-color: lightpink;
        }

        h1 {
            color: purple;
        }

        p {
            color: darkblue;
        }
    </style>
</head>

<!-- Inline CSS -->
<body style="background-color: lightyellow;">

    <h1 style="color: red;">Hello World</h1>

    <p style="color: blue;">
        This is Inline, Internal and External CSS.
    </p>

</body>
</html>
